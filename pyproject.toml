[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overseer-ai"
version = "0.1.0"
description = "A supervisor agent that watches your AI agents and stops them when they loop, drift, or stall."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agents", "supervisor", "observability", "llm", "crewai", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.30.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "watchdog>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
crewai = ["crewai>=0.28.0", "crewai-tools>=0.1.0"]
dev    = ["pytest>=8.0", "httpx>=0.27.0"]

[project.urls]
Homepage   = "https://github.com/yourusername/overseer"
Dashboard  = "https://www.perplexity.ai/computer/a/overseer-agent-supervisor-Fpp7YCwpTl66DZytcsLLqg"
Issues     = "https://github.com/yourusername/overseer/issues"

[project.scripts]
overseer = "overseer.cli:cli"

[tool.setuptools.packages.find]
where   = ["."]
include = ["overseer*"]
